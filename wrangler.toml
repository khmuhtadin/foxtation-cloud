name = "foxtation-cloud"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "foxtation.khaisa.studio", custom_domain = true }]

# The landing page. A GET that matches a file in site/ is served from there;
# everything else, including every /v1/* request, falls through to the Worker.
assets = { directory = "./site" }

[vars]
# Switch to https://sandbox-api.polar.sh while testing with sandbox license keys.
POLAR_API = "https://api.polar.sh"
# Polar › Settings › General › Organization ID
POLAR_ORGANIZATION_ID = "98cabd68-171f-4362-bf23-c277be23a276"
# Customer portal: subscription, invoices, license keys and device activations
POLAR_PORTAL_URL = "https://polar.sh/khaisa-studios/portal"
# Cleanups per license key per UTC day
DAILY_LIMIT = "500"
# Anthropic Console › Settings › Workspaces › Foxtation (wrkspc_…)
ANTHROPIC_WORKSPACE_ID = "wrkspc_0178eLUwQhdNzJyRERLWMZWv"

# Secret, set with: npx wrangler secret put ANTHROPIC_API_KEY

[[durable_objects.bindings]]
name = "USAGE"
class_name = "Usage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Usage"]
